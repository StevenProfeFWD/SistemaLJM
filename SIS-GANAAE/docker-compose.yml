
services:
  database:
    image: postgres:16
    container_name: postgres-db
    restart: always
    # Solo localhost del host (no 0.0.0.0). En producción elimine este bloque ports.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: gestion_asistencias_marti
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./database:/docker-entrypoint-initdb.d
      - gestion_asistencias_data:/var/lib/postgresql
    networks:
      - marti-network

  backend:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: node-backend
    restart: always
    depends_on:
      - database
    env_file:
      - .env
    environment:
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASS}
      DB_NAME: gestion_asistencias_marti
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./backend-node:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev
    networks:
      - marti-network

  frontend:
    build: ./frontend-reactjs
    container_name: react-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend-reactjs:/app
      - /app/node_modules
    networks:
      - marti-network
    command: npm run dev

networks:
  marti-network:
    driver: bridge

volumes:
  gestion_asistencias_data:
